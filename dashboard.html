<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Client Dashboard | Data's Army</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#FAFAF9;color:#18181B}nav{background:#18181B;padding:14px 20px}nav a{color:#fff;margin-right:18px;text-decoration:none}main{max-width:960px;margin:auto;padding:24px 20px}.card{background:#fff;border:1px solid #DEDDD8;border-radius:12px;padding:18px;margin-bottom:16px}button{background:#2A78D6;color:#fff;border:0;padding:10px 18px;border-radius:20px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #DEDDD8;padding:8px;text-align:left}</style></head><body>
<nav><a href="index.html">Home</a><a href="#knowledge">Knowledge</a><a href="#calls">Calls</a></nav><main><h1>Client dashboard (demo)</h1>
<div class="card" id="knowledge"><h2>Knowledge &gt; Upload documents</h2><input type="file" id="f" multiple accept=".pdf,.doc,.docx,.txt"><ul id="list"></ul><button onclick="document.getElementById('st').textContent='Test call simulated: AI answered using your documents.'">Test</button> <button onclick="document.getElementById('st').textContent='Published. Your AI receptionist is live.'">Publish</button><p id="st"></p></div>
<div class="card" id="calls"><h2>Recent calls</h2><table><tr><th>Time</th><th>Caller</th><th>Summary</th></tr><tr><td>Demo</td><td>Sample caller</td><td>Sample data only</td></tr></table></div></main>
<script>document.getElementById('f').onchange=e=>{const l=document.getElementById('list');l.innerHTML='';[...e.target.files].forEach(x=>{const li=document.createElement('li');li.textContent=x.name+' (stored in this browser only, demo)';l.appendChild(li)})}</script></body></html>
